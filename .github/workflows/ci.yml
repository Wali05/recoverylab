name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - run: go build ./cmd/recoverylab
      - run: go run ./cmd/recoverylab demo
  # Run the repo's own action the way someone else would, against the
  # built-in fixture. The crash example starts "recoverylab" from PATH.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          scenario: examples/crash-retry.json
          bursts: '3'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recoverylab-report
          path: recoverylab-report.html
  # The path a new user takes: read an OpenAPI document, then audit every
  # endpoint it describes.
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: go build -o recoverylab ./cmd/recoverylab
      - name: Discover and audit the fixture
        run: |
          ./recoverylab fixture --listen 127.0.0.1:18080 --journal "$RUNNER_TEMP/journal.jsonl" &
          for i in $(seq 50); do curl -fs http://127.0.0.1:18080/health && break; sleep 0.1; done
          ./recoverylab discover --base http://127.0.0.1:18080 --out "$RUNNER_TEMP/scenarios"
          ./recoverylab audit --bursts 3 --badge "$RUNNER_TEMP/badge.svg" --markdown "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/scenarios"
  # Install the latest published release the way the README says to.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: sh install.sh
        env:
          RECOVERYLAB_INSTALL_DIR: ${{ runner.temp }}/bin
          GH_TOKEN: ${{ github.token }}
      - run: '"$RUNNER_TEMP/bin/recoverylab" demo'
