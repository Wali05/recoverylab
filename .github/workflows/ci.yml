name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/recoverylab
      - run: go run ./cmd/recoverylab demo
  # Run the repo's own action the way someone else would, against the
  # built-in fixture. The crash example starts "recoverylab" from PATH.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          scenario: examples/crash-retry.json
          bursts: '3'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recoverylab-report
          path: recoverylab-report.html
