name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/recoverylab
      - run: go run ./cmd/recoverylab demo
