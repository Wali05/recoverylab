name: Release draft

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          go run ./cmd/recoverylab demo
      - name: Build binaries and checksums
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v0.1.0" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            IFS=/ read -r goos goarch <<< "$target"
            suffix=""
            if [[ "$goos" == windows ]]; then suffix=".exe"; fi
            asset="recoverylab_${version}_${goos}_${goarch}${suffix}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w -X main.version=$version" \
              -o "dist/$asset" ./cmd/recoverylab
          done
          (cd dist && sha256sum recoverylab_* > checksums.txt)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --draft --title "RecoveryLab $GITHUB_REF_NAME" --generate-notes
