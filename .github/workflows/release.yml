name: Release draft

# A release starts from a pushed tag, or from the Actions tab with a version.
# Started by hand, the draft points at main and GitHub creates the tag when
# the draft is published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v0.5.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          go run ./cmd/recoverylab demo
      - name: Build binaries and checksums
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v0.1.0" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Start releases by hand from main" >&2
            exit 1
          fi
          version="${TAG#v}"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            IFS=/ read -r goos goarch <<< "$target"
            suffix=""
            if [[ "$goos" == windows ]]; then suffix=".exe"; fi
            asset="recoverylab_${version}_${goos}_${goarch}${suffix}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w -X main.version=$version" \
              -o "dist/$asset" ./cmd/recoverylab
          done
          (cd dist && sha256sum recoverylab_* > checksums.txt)
          "./dist/recoverylab_${version}_linux_amd64" version | grep -Fx "RecoveryLab $version"
          "./dist/recoverylab_${version}_linux_amd64" demo
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release page opens with this version's CHANGELOG.md section.
          awk -v want="## ${TAG#v}" '$0 == want {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [[ -s notes.md ]]; then
            notes=(--notes-file notes.md --generate-notes)
          else
            echo "::warning::CHANGELOG.md has no section for ${TAG#v}"
            notes=(--generate-notes)
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "$TAG already exists; push a new version instead" >&2
              exit 1
            fi
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" --draft --title "RecoveryLab $TAG" "${notes[@]}"
          else
            gh release create "$TAG" dist/* \
              --verify-tag --draft --title "RecoveryLab $TAG" "${notes[@]}"
          fi
